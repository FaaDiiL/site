name: Build & Deploy to Heroku

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            server/node_modules
          key: deps-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: |
          pnpm config set minimum-release-age 0
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Commit built files and push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"
          [ -d frontend/dist ] && git add -f frontend/dist
          [ -d server/dist ]   && git add -f server/dist
          git diff --staged --quiet || git commit -m "chore: deploy build [skip ci]"
          git push --force https://:$HEROKU_API_KEY@git.heroku.com/alfarhan.git HEAD:main
